<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="RigPilot — pose a humanoid body, key it on a timeline, and play it. Joint limits make impossible poses impossible. An AI agent can drive the same studio over MCP."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161a" />
    <title>RigPilot · pose, key and play a humanoid</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="shell">
      <header id="top"></header>
      <aside id="side">
        <div id="panel"></div>
      </aside>
      <main id="stage">
        <canvas
          id="view"
          aria-label="3D view of the humanoid rig — drag to orbit, click a joint to select it"
        ></canvas>
        <div id="views" class="hud views" role="group" aria-label="camera views"></div>
        <div id="info" class="hud"></div>
        <div id="status" class="hud status" role="status" aria-live="polite"></div>
        <pre id="report" class="hud report" aria-live="polite"></pre>
        <span id="hover" class="hud hover" aria-hidden="true"></span>
      </main>
      <footer id="dock">
        <div id="timeline"></div>
        <div id="clip"></div>
      </footer>
    </div>
    <div id="overlay"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript
      ><p>
        RigPilot is a 3D posing and keyframing studio, so it needs JavaScript. Everything else about
        it — the rig data, the animation file format, the physics rules — is in
        <a href="https://github.com/AG-TheCoderr/ultimate">the repository</a>.
      </p></noscript
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
